<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P Video Call & Chat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="main-section">
        <h1>P2P Video Call</h1>

        <div class="room-control">
          <input type="text" id="roomId" placeholder="Enter Room ID" />
          <button id="joinRoom">Join</button>
        </div>

        <!-- Separated Status & Timer so text doesn't wipe out the timer -->
        <div class="status-container">
          <span id="status">Not connected</span>
          <span id="callTimer" class="timer" style="display: none">00:00</span>
        </div>

        <div class="video-container">
          <video id="remoteVideo" autoplay playsinline></video>
          <video
            id="localVideo"
            autoplay
            muted
            playsinline
            class="pip-video"
          ></video>
        </div>

        <div class="controls">
          <button id="startCamera">Start Camera</button>
          <button id="flipCameraBtn" style="display: none">Flip Camera</button>
          <button id="muteBtn" style="display: none">Mute</button>
          <button id="cameraBtn" style="display: none">Cam Off</button>
          <button id="disconnectBtn" style="display: none">End</button>
        </div>
      </div>

      <div class="chat-sidebar">
        <h3>Chat</h3>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" id="messageInput" placeholder="Type message..." />
          <button id="sendMsgBtn">Send</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
